name: Repo Keepalive

# ───────────────────────────────────────────────────────────
# [목적] GitHub 스케줄 워크플로우 60일 자동 비활성화 방지
#
#   GitHub은 저장소에 60일간 커밋(활동)이 없으면 schedule 트리거
#   워크플로우를 자동으로 disabled 처리한다. 그러면 daily_update.yml 이
#   조용히 멈추고 → 평일 Supabase write 중단 → 7일 후 Supabase pause.
#
#   이 워크플로우는 매달 1회 빈 커밋(heartbeat)을 push 하여
#   60일 타이머를 리셋한다. → daily_update.yml 이 계속 살아있게 유지.
#
# [중요] 반드시 PAT(Personal Access Token) 로 push 해야 한다.
#   기본 GITHUB_TOKEN 으로 만든 커밋은 "봇 활동"으로 간주되어
#   60일 타이머가 리셋되지 않는 경우가 있다.
#   → 저장소 Secret 'KEEPALIVE_PAT' 에 PAT 를 등록해야 동작.
#     (발급/등록 방법은 아래 대화 안내 참고)
# ───────────────────────────────────────────────────────────

on:
  schedule:
    # 매달 1일 15:00 UTC = 매달 2일 00:00 KST (약 30일 주기 → 60일 한도의 2배 여유)
    - cron: "0 15 1 * *"
  workflow_dispatch:            # Actions 탭에서 수동 실행도 가능

# heartbeat 커밋을 push 하려면 쓰기 권한 필요
permissions:
  contents: write

# 동시 실행 방지
concurrency:
  group: repo-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Heartbeat commit
    runs-on: ubuntu-latest
    steps:
      # 1) PAT 로 체크아웃 (기본 GITHUB_TOKEN 대신 KEEPALIVE_PAT 사용)
      - name: Checkout with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.KEEPALIVE_PAT }}
          fetch-depth: 0

      # 2) Secret 존재 여부 사전 검증 (미등록 시 명확한 에러)
      - name: Verify PAT secret
        run: |
          if [ -z "${{ secrets.KEEPALIVE_PAT }}" ]; then
            echo "::error::KEEPALIVE_PAT secret 이 없습니다. 저장소 Settings → Secrets 에 등록하세요."
            exit 1
          fi
          echo "✅ KEEPALIVE_PAT present"

      # 3) 빈 커밋으로 저장소 활동 타이머 리셋
      #    [skip ci] 로 다른 워크플로우(daily_update 등) 트리거 방지
      - name: Push heartbeat commit
        run: |
          git config user.name  "safeinvest-keepalive[bot]"
          git config user.email "safeinvest-keepalive@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive heartbeat ($(date '+%Y-%m-%d')) [skip ci]"
          git push

      # 4) Job Summary 기록
      - name: Summary
        if: always()
        run: |
          {
            echo "## 💓 Repo Keepalive"
            echo ""
            echo "- **Status**: ${{ job.status }}"
            echo "- **Run time (UTC)**: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "- 이 커밋으로 GitHub 60일 자동 비활성화 타이머가 리셋됩니다."
          } >> $GITHUB_STEP_SUMMARY

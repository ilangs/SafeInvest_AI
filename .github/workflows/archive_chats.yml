name: Weekly Chat History Archive

# ───────────────────────────────────────────────────────────
# 매주 일요일 03:00 KST 에 chat_history 의 30일 경과분을
# chat_history_archive 로 이관하고 원본을 삭제한다.
# Supabase Free 500MB 한도 영구 방어.
#
# - user_orders 는 자동 삭제 대상 아님 (감사/회고 학습용 보존)
# - 실패 시 GitHub Actions 메일 자동 발송 + Job summary 표시
# ───────────────────────────────────────────────────────────

on:
  schedule:
    # 매주 일요일 18:00 UTC = 월요일 03:00 KST
    # cron 표기상 0(일요일)을 쓰면 KST 월요일 새벽 = 한 주의 시작 직전
    - cron: "0 18 * * 0"
  workflow_dispatch:           # 수동 실행 (Actions 탭의 Run workflow 버튼)
    inputs:
      days:
        description: "이 일수 이전 데이터만 이관 (기본 30)"
        required: false
        default: "30"
        type: string
      dry_run:
        description: "true 면 대상 건수만 출력하고 실제 이관 생략"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# 동시 실행 방지
concurrency:
  group: archive-chats
  cancel-in-progress: false

jobs:
  archive:
    name: Run chat_history archive batch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      # ── Supabase (daily_update.yml 과 동일 secrets 재사용) ──
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 아래 두 키는 archive_old_chats.py 자체에선 미사용이지만
      # config.py 가 import 시점에 요구하므로 더미값이라도 노출.
      SUPABASE_ANON_KEY:          ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_JWT_SECRET:        ${{ secrets.SUPABASE_JWT_SECRET }}

    steps:
      # 1) 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Python 설치
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # 3) 의존성 설치 (supabase-py 만 있으면 충분하지만 단순성 위해 전체 설치)
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4) Secrets 사전 검증
      - name: Verify secrets
        run: |
          if [ -z "$SUPABASE_URL" ];              then echo "::error::SUPABASE_URL missing";              exit 1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY missing"; exit 1; fi
          echo "✅ Required secrets present"

      # 5) 파라미터 결정 (수동 실행 input 우선)
      - name: Determine parameters
        id: params
        run: |
          DAYS="${{ github.event.inputs.days }}"
          DRY="${{ github.event.inputs.dry_run }}"
          if [ -z "$DAYS" ]; then DAYS="30"; fi
          if [ -z "$DRY" ];  then DRY="false"; fi
          echo "days=$DAYS"   >> $GITHUB_OUTPUT
          echo "dry_run=$DRY" >> $GITHUB_OUTPUT
          echo "🟢 days=$DAYS, dry_run=$DRY"

      # 6) archive_old_chats.py 실행
      - name: Run archive_old_chats.py
        working-directory: backend
        run: |
          ARGS="--days ${{ steps.params.outputs.days }}"
          if [ "${{ steps.params.outputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "▶ python scripts/archive_old_chats.py $ARGS"
          python scripts/archive_old_chats.py $ARGS

      # 7) Job Summary 생성
      - name: Generate job summary
        if: always()
        run: |
          {
            echo "## 🗄️ Weekly Chat Archive Result"
            echo ""
            echo "- **days**: \`${{ steps.params.outputs.days }}\`"
            echo "- **dry_run**: \`${{ steps.params.outputs.dry_run }}\`"
            echo "- **Status**: ${{ job.status }}"
            echo "- **Triggered**: ${{ github.event_name }}"
            echo "- **Run time (KST)**: $(date '+%Y-%m-%d %H:%M:%S')"
          } >> $GITHUB_STEP_SUMMARY

      # 8) 실패 시 알림
      - name: Failure notice
        if: failure()
        run: |
          echo "::error::Chat archive failed. Re-run via Actions tab → 'Run workflow'."
